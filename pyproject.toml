[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "solar-forge-life-desktop"
version = "0.1.0"
description = "Solar Forge Life Helper native desktop application"
requires-python = ">=3.14,<3.15"
dependencies = [
  "PySide6==6.11.2",
  "SQLAlchemy==2.0.54",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "pytest-qt==4.5.0",
  "ruff==0.16.9",
]

[project.scripts]
solar-forge-desktop = "solar_forge_desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_forge_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
